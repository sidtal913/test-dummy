services:
  postgres:
    image: postgres:16-alpine
    container_name: helloapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: helloapp
      POSTGRES_PASSWORD: helloapp_dev
      POSTGRES_DB: helloapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helloapp -d helloapp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
