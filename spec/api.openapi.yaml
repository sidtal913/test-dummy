openapi: 3.1.0
info:
  title: Hello App VPods delivery API
  version: 1.0.0
  description: Application contracts published by Knox (backend).
paths:
  /api/someone-create-branch-vpods-hire-was-not-found-o:
    get:
      operationId: getHireDeliveryBranchStatus
      summary: Check whether vpods/hire exists on the delivery repository
      tags: [delivery]
      responses:
        '200':
          description: Hire integration branch exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HireBranchStatusResponse'
        '404':
          description: Hire integration branch missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HireBranchStatusResponse'
    post:
      operationId: ensureHireDeliveryBranch
      summary: Create vpods/hire from main when missing
      tags: [delivery]
      responses:
        '200':
          description: Branch already existed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HireBranchEnsureResponse'
        '201':
          description: Branch created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HireBranchEnsureResponse'
        '503':
          description: GITHUB_TOKEN not configured for branch creation
  /api/orders:
    get:
      operationId: listOrders
      summary: List brownie catalog and persisted orders
      tags: [orders]
      responses:
        '200':
          description: Catalog and order queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdersPayloadResponse'
    post:
      operationId: createOrder
      summary: Place a brownie batch order
      tags: [orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Validation error
components:
  schemas:
    HireBranchStatusResponse:
      type: object
      required:
        - deliveryBranch
        - repository
        - integrationBranch
        - found
        - checkedAt
        - ticket
      properties:
        deliveryBranch:
          type: string
          example: vpods/hire
        repository:
          type: string
          example: sidtal913/test-dummy
        integrationBranch:
          type: string
          example: main
        found:
          type: boolean
        sha:
          type: string
          nullable: true
        htmlUrl:
          type: string
          format: uri
          nullable: true
        checkedAt:
          type: string
          format: date-time
        ticket:
          type: string
          example: TAXI-19
        hint:
          type: string
          nullable: true
    HireBranchEnsureResponse:
      allOf:
        - $ref: '#/components/schemas/HireBranchStatusResponse'
        - type: object
          required: [created, message]
          properties:
            created:
              type: boolean
            message:
              type: string
    CreateOrderRequest:
      type: object
      required: [productName, quantity]
      properties:
        productName:
          type: string
        quantity:
          type: integer
          minimum: 1
          maximum: 99
    OrderResponse:
      type: object
      required: [id, productName, quantity, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
        productName:
          type: string
        quantity:
          type: integer
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CatalogItemResponse:
      type: object
      required: [sku, name, unitPriceCents]
      properties:
        sku:
          type: string
        name:
          type: string
        unitPriceCents:
          type: integer
    OrdersPayloadResponse:
      type: object
      required: [catalog, orders]
      properties:
        catalog:
          type: array
          items:
            $ref: '#/components/schemas/CatalogItemResponse'
        orders:
          type: array
          items:
            $ref: '#/components/schemas/OrderResponse'
